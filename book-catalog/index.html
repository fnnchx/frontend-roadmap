<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assests/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="./script.js" defer></script>
    <title>ozon671 | Книжный каталог</title>
</head>
<body>

    <!-- Навигация -->
    <header class="site-header">
        <div class="logo">ozon671</div>
        <nav>
            <ul>
                <li><a href="#books-section">Книги</a></li>
                <li><a href="#favorites-section">Избранное</a></li>
            </ul>
        </nav>
        <div class="social-links">
            <a href="https://www.youtube.com/ozon671games3" aria-label="Youtube">yt</a>
            <a href="t.me/ O_J6YXRB5UxjN2Qy" aria-label="Telegram">t</a>
            <a href="audioknigax@rambler.ru" aria-label="Audio books">a</a>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Найдите свою следующую любимую книгу в нашем каталоге.</h1>
                <br>
                <form id="search-form" class="search-form">
                    <input type="text" id="search-input" required minlength="2" placeholder="Введите название или автора...">
                    <button type="submit" aria-label="Поиск">Найти</button>
                </form>
            </div>
            <div class="hero-image-wrapper">
                <div class="circle-bg"></div>
                <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=800&auto=format&fit=crop" alt="Счастливая читательница" class="hero-img-person">
                <div class="book-cover-wrapper">
                    <div class="book-cover">
                        <span class="author-name">Мальцев Р. А.</span>
                        <h2 class="book-title-hero">Тихий Дэн</h2>
                        <span class="book-badge">Хитяра</span>
                    </div>
                </div>
                <div class="gold-blob blob-1"></div>
                <div class="gold-blob blob-2"></div>
            </div>
        </section>

        <div id="status-message" class="status-message" aria-live="polite"></div>

        <section id="books-section" class="catalog-section">
            <h2 class="section-title">Результаты поиска</h2>
            <div class="books-grid" id="books-container">
            </div>
        </section>

        <section id="favorites-section" class="catalog-section favorites-section">
            <h2 class="section-title">Ваше избранное</h2>
            <div class="books-grid" id="favorites-container">
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 ozon671 Books. Все права защищены.</p>
    </footer>
</body>
</html>
